<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Guess the number</title>
    </head>
    <body>
        <div class="main-box">
            <div class="player">
                <p>Игрок 1</p>
                <p class="total-score-0">0</p>
                <div class="score">
                    <p>Текущие очки:</p>
                    <p class="score-0">0</p>
                </div>
            </div>
            <div class="game-field">
                <img id="dice-element" src="/img/2.jpg" alt="Кубик">
                <button class="roll-button">Бросить</button>
                <button class="leave-points">Оставить очки</button>
            </div>
            <div class="player">
                <p>Игрок 2</p>
                <p class="total-score-1">0</p>
                <div class="score">
                    <p>Текущие очки:</p>
                    <p class="score-1">0</p>
                </div>
            </div>
        </div>
        <script src="app.js"></script>
    </body>
</html>
